{% load static %}
<div class="main-header">
  <div class="header-links">
    <a href="{% url 'main:home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">🏠 Главная</a>
    <a href="{% url 'internal_accounting:adult:student_list' %}" class="nav-link {% if 'adult' in request.path %}active{% endif %}">👨 Взрослые</a>
    <a href="{% url 'internal_accounting:child:student_list' %}" class="nav-link {% if 'child' in request.path %}active{% endif %}">👶 Дети</a>
    <a href="{% url 'instructor:dashboard' %}" class="nav-link {% if 'instructor' in request.path %}active{% endif %}">🚗 Инструктор</a>
    <a href="{% url 'instructor:admin_panel' %}" class="nav-link nav-admin">🔧 Админ</a>
  </div>
</div>

<style>
  .main-header {
    background: #2c3e50;
    padding: 15px 20px;
    margin-bottom: 20px;
  }
  
  .header-links {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  
  .nav-link {
    color: #ecf0f1;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 6px;
    transition: all 0.3s;
  }
  
  .nav-link:hover {
    background: #34495e;
  }
  
  .nav-link.active {
    background: #3498db;
    color: white;
    font-weight: bold;
  }
</style>
