<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}

      {% endblock %}
    </title>
    {% load static %}
    {% block base_css %}

    {% endblock %}
  </head>
  <body>
    {% block header %}
      {% include 'base/header.html' %}
    {% endblock %}
    <hr />
    <main>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
